
services:
  kafka1:
    image: docker.io/bitnami/kafka:3.6
    container_name: kafka1
    ports:
      - "9094:9094"
    expose:
      - 9092
    # volumes:
    #   - "./volumes/kafka/kafka1:/bitnami"
    environment:
      - KAFKA_KRAFT_CLUSTER_ID=idoiEQekTMOcFtjqF5ERSw
      # KRaft settings
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      # Listeners
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka1:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
  kafka2:
    image: docker.io/bitnami/kafka:3.6
    container_name: kafka2
    ports:
      - "9095:9095"
    expose:
      - 9092
    # volumes:
    #   - "./volumes/kafka/kafka2:/bitnami"
    environment:
      - KAFKA_KRAFT_CLUSTER_ID=idoiEQekTMOcFtjqF5ERSw
      # KRaft settings
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      # Listeners
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka2:9092,EXTERNAL://localhost:9095
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
  kafka3:
    image: docker.io/bitnami/kafka:3.6
    container_name: kafka3
    ports:
      - "9096:9096"
    expose:
      - 9092
    # volumes:
    #   - "./volumes/kafka/kafka3:/bitnami"
    environment:
      - KAFKA_KRAFT_CLUSTER_ID=idoiEQekTMOcFtjqF5ERSw
      # KRaft settings
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      # Listeners
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9096
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka3:9092,EXTERNAL://localhost:9096
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
  pg:
    image: postgres:13
    container_name: pg
    expose:
      - 5432
    # volumes:
    #   - ./volumes/pg:/var/lib/postgresql/data:rw
    environment:
      - POSTGRES_USER=pg
      - POSTGRES_PASSWORD=pg123
  pg2:
    image: postgres:13
    container_name: pg2
    expose:
      - 5432
    # volumes:
    #   - ./volumes/pg2:/var/lib/postgresql/data:rw
    environment:
      - POSTGRES_USER=pg2
      - POSTGRES_PASSWORD=pg2123
  connect:
    image: debezium/connect:2.4
    container_name: connect1
    ports:
      - "8083:8083"
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    environment:
      - GROUP_ID=debezium-connect-group-1
      - HOST_NAME=connect
      - CONFIG_STORAGE_TOPIC=my-connect-configs
      - OFFSET_STORAGE_TOPIC=my-connect-offsets
      - STATUS_STORAGE_TOPIC=my-connect-statuses
      - ADVERTISED_HOST_NAME=connect
      - CONNECT_DEFAULT_REPLICATION_FACTOR=3
      - CONNECT_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      # - ADVERTISED_HOST_NAME=$(echo $DOCKER_HOST | cut -f3  -d'/' | cut -f1 -d':')
      - BOOTSTRAP_SERVERS=kafka1:9092,kafka2:9092,kafka3:9092
