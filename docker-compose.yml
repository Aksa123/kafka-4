services:
  broker:
    image: apache/kafka:4.2.1-rc3
    container_name: kafka-broker
    ports:
      - "9094:9094"
    expose:
      - 9095
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093,EXTERNAL://:9094,DOCKER://broker:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,EXTERNAL://localhost:9094,DOCKER://broker:9095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 10

  postgres:
    image: postgres:17.5-bullseye
    container_name: postgres
    ports:
      - 5437:5432
    expose:
      - 5432
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
      
  init:
    build: .
    container_name: init
    volumes:
      - ./code:/app/code/
    env_file:
      - .env
    environment:
      - IS_DOCKER=1
      - GROUP_INSTANCE_ID=init
      - BOOTSTRAP_SERVERS=broker:9095
      - DB_HOST=postgres
    depends_on:
      broker:
        condition: service_started
      postgres:
        condition: service_healthy
    working_dir: /app/code
    command: ["python3", "init.py"]

  cronjob:
    build: .
    container_name: cronjob
    volumes:
      - ./code:/app/code/
    env_file:
      - .env
    environment:
      - IS_DOCKER=1
      - GROUP_INSTANCE_ID=cronjob
      - BOOTSTRAP_SERVERS=broker:9095
      - DB_HOST=postgres
    depends_on:
      broker:
        condition: service_started
      init:
        condition: service_completed_successfully
    working_dir: /app/code
    command: ["python3", "cronjob.py"]

  consumer-1:
    build: .
    container_name: consumer-1
    volumes:
      - ./code:/app/code/
    env_file:
      - .env
    environment:
      - IS_DOCKER=1
      - GROUP_INSTANCE_ID=axa-1
      - BOOTSTRAP_SERVERS=broker:9095
      - DB_HOST=postgres
    depends_on:
      broker:
        condition: service_started
      init:
        condition: service_completed_successfully
    working_dir: /app/code
    command: ["python3", "consumer.py"]

  consumer-2:
    build: .
    container_name: consumer-2
    volumes:
      - ./code:/app/code/
    env_file:
      - .env
    environment:
      - IS_DOCKER=1
      - GROUP_INSTANCE_ID=axa-2
      - BOOTSTRAP_SERVERS=broker:9095
      - DB_HOST=postgres
    depends_on:
      broker:
        condition: service_started
      init:
        condition: service_completed_successfully
    working_dir: /app/code
    command: ["python3", "consumer.py"]